var LS_KEY = "itoshi-pet-status-v1";
function loadStatus(){
  try{ var raw = localStorage.getItem(LS_KEY); if(!raw) return {}; var o = JSON.parse(raw); return (o && typeof o==="object") ? o : {}; }catch(e){ return {}; }
}
function saveStatus(map){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(map)); }catch(e){}
}
var statusMap = loadStatus();
function getStatus(id){ var v = statusMap[String(id)]; return (v==="considering"||v==="excluded") ? v : "none"; }

var TARGET_LABEL = {dog:"🐶 犬", cat:"🐱 猫", both:"🐶🐱 犬・猫"};
var state = { axis:"all", target:"all", status:"all", q:"" };

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sourcingClass(s){
  if(s.indexOf("高")===0) return "badge-s-hi";
  if(s.indexOf("低")===0) return "badge-s-lo";
  return "badge-s-mid";
}
function shortUrl(u){ return u.replace(/^https?:\/\//,""); }

function renderFilters(){
  var aC = CANDIDATES.filter(function(c){return c.axis==="A";}).length;
  var bC = CANDIDATES.filter(function(c){return c.axis==="B";}).length;
  var cons = CANDIDATES.filter(function(c){return getStatus(c.id)==="considering";}).length;
  document.getElementById("counts").textContent = "全"+CANDIDATES.length+"件 ・ ★検討中 "+cons+"件";
  var axisDefs = [
    {v:"all",label:"すべて "+CANDIDATES.length,cls:""},
    {v:"A",label:"軸A 記念日・パーソナライズ "+aC,cls:"mustard"},
    {v:"B",label:"軸B 個性的・わくわく "+bC,cls:"teal"}
  ];
  document.getElementById("axisFilters").innerHTML = axisDefs.map(function(d){
    return '<button type="button" class="chip '+d.cls+'" data-axis="'+d.v+'" aria-pressed="'+(state.axis===d.v)+'">'+esc(d.label)+'</button>';
  }).join("");
  var targetDefs = [
    {v:"all",label:"対象：すべて"},{v:"dog",label:"🐶 犬"},{v:"cat",label:"🐱 猫"},{v:"both",label:"犬・猫両方"}
  ];
  document.getElementById("targetFilters").innerHTML = targetDefs.map(function(d){
    return '<button type="button" class="chip" data-target="'+d.v+'" aria-pressed="'+(state.target===d.v)+'">'+esc(d.label)+'</button>';
  }).join("");
  var statusDefs = [
    {v:"all",label:"印：すべて"},{v:"considering",label:"★ 検討中"},{v:"excluded",label:"除外"},{v:"none",label:"未チェック"}
  ];
  document.getElementById("statusFilters").innerHTML = statusDefs.map(function(d){
    return '<button type="button" class="chip" data-statusfilter="'+d.v+'" aria-pressed="'+(state.status===d.v)+'">'+esc(d.label)+'</button>';
  }).join("");
}

function render(){
  renderFilters();
  var q = state.q.trim().toLowerCase();
  var visible = CANDIDATES.filter(function(c){
    if(state.axis!=="all" && c.axis!==state.axis) return false;
    if(state.target!=="all" && c.target!==state.target) return false;
    var st = getStatus(c.id);
    if(state.status!=="all" && st!==state.status) return false;
    if(q){
      var hay = (c.name+" "+c.emotion+" "+c.arrangement+" "+c.evidence).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  document.getElementById("empty").hidden = visible.length!==0;
  var html = visible.map(function(c){
    var st = getStatus(c.id);
    var srcHtml = c.sourceUrl
      ? '出典：<span>'+esc(c.sourceLabel)+'</span> <a href="'+esc(c.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(shortUrl(c.sourceUrl))+'</a>'
      : '出典：<span>'+esc(c.sourceLabel||"—")+'</span>';
    var tiktokHtml = c.tiktokUrl
      ? '<a class="tiktok-btn" href="'+esc(c.tiktokUrl)+'" target="_blank" rel="noopener noreferrer">▶ TikTokで見る</a>' : "";
    return '<li class="card'+(st==="excluded"?" excluded":"")+'">'
      + '<div class="card-top"><div class="badges">'
      + '<span class="badge '+(c.axis==="A"?"badge-a":"badge-b")+'">'+(c.axis==="A"?"軸A 記念日":"軸B わくわく")+'</span>'
      + '<span class="badge badge-t">'+esc(TARGET_LABEL[c.target])+'</span>'
      + '<span class="badge '+sourcingClass(c.sourcing)+'">仕入れ '+esc(c.sourcing)+'</span>'
      + '</div><span class="price">'+esc(c.priceBand)+'</span></div>'
      + '<h2>'+esc(c.name)+'</h2>'
      + (c.emotion ? '<p class="emotion">💗 '+esc(c.emotion)+'</p>' : "")
      + (c.evidence ? '<p class="evidence">'+esc(c.evidence)+'</p>' : "")
      + (c.arrangement ? '<p class="arrange"><b>itoshi流：</b>'+esc(c.arrangement)+'</p>' : "")
      + '<p class="src">'+srcHtml+'</p>'
      + tiktokHtml
      + '<div class="statusrow" role="group" aria-label="'+esc(c.name)+' の印">'
      + '<button type="button" data-id="'+c.id+'" data-set="none" aria-pressed="'+(st==="none")+'" class="'+(st==="none"?"on-none":"")+'">未チェック</button>'
      + '<button type="button" data-id="'+c.id+'" data-set="considering" aria-pressed="'+(st==="considering")+'" class="'+(st==="considering"?"on-considering":"")+'">★ 検討中</button>'
      + '<button type="button" data-id="'+c.id+'" data-set="excluded" aria-pressed="'+(st==="excluded")+'" class="'+(st==="excluded"?"on-excluded":"")+'">除外</button>'
      + '</div></li>';
  }).join("");
  document.getElementById("list").innerHTML = html;
}

document.addEventListener("click", function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  var ax = t.getAttribute("data-axis");
  if(ax!==null){ state.axis = ax; render(); return; }
  var tg = t.getAttribute("data-target");
  if(tg!==null){ state.target = tg; render(); return; }
  var sf = t.getAttribute("data-statusfilter");
  if(sf!==null){ state.status = sf; render(); return; }
  var set = t.getAttribute("data-set");
  var id = t.getAttribute("data-id");
  if(set!==null && id!==null){
    if(set==="none"){ delete statusMap[String(id)]; } else { statusMap[String(id)] = set; }
    saveStatus(statusMap);
    render();
  }
});
document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; render(); });
render();
</script>
</body>
</html>
